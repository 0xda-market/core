name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.11"
          bundler-cache: true
      - name: Run unit tests
        id: unit_tests
        run: |
          set -o pipefail
          bundle exec rake >unit-test.log 2>&1 || {
            cat unit-test.log
            exit 1
          }
      - name: Validate documented repository links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash bin/check_documented_repositories
      - name: Upload unit failure log
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: unit-test.log
          retention-days: 3

  test:
    name: Integration (PostgreSQL ${{ matrix.pg_release }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg_release: "17"
            pg_image: postgres:17-alpine
          # Match the immutable production PostgreSQL 18.6 image on edge-prod-1.
          - pg_release: "18.6"
            pg_image: postgres@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zero_x_da_test
    services:
      postgres:
        image: ${{ matrix.pg_image }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zero_x_da_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zero_x_da_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.11"
          bundler-cache: true
      - name: Validate core architecture boundary
        run: bundle exec ruby -Itest test/architecture_boundaries_test.rb
      - name: Run integration tests
        id: integration_tests
        run: |
          set -o pipefail
          bundle exec rake >integration-test.log 2>&1 || {
            cat integration-test.log
            exit 1
          }
      - name: Upload integration failure log
        if: failure() && steps.integration_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-log
          path: integration-test.log
          retention-days: 3
      - name: Validate operational scripts
        run: |
          ruby -c bin/bootstrap_admin
          ruby -c bin/refresh_fx_rates
          ruby -c bin/refresh_fx_rates_loop
          bash -n bin/check_documented_repositories
          bash -n scripts/dispatch-development-workload.sh
          bash scripts/test-development-infra.sh
          bash -n deploy/vps/bootstrap-ubuntu.sh
          bash -n deploy/vps/deploy.sh
          bash -n deploy/vps/rollback.sh
          bash -n deploy/vps/verify.sh
          bash test/vps_verify_test.sh
          cat >deploy/vps/.env <<'ENV'
          DEPLOY_ENV=development
          DOMAIN=example.invalid
          MARKET_EDGE_NETWORK=nilx-edge
          EDGE_OWNER=infra
          ENV
          docker compose --file deploy/vps/compose.yaml --env-file deploy/vps/.env config --quiet

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag 0xda-market:test .
      - name: Verify development worker process commands exist
        run: |
          docker run --rm 0xda-market:test ruby -c bin/refresh_fx_rates_loop
          docker run --rm 0xda-market:test ruby -c bin/refresh_market_prices_loop
      - name: Validate product-only Compose ownership
        run: |
          cat >deploy/vps/.env <<'ENV'
          DEPLOY_ENV=development
          DOMAIN=example.invalid
          MARKET_EDGE_NETWORK=nilx-edge
          EDGE_OWNER=infra
          ENV
          services="$(docker compose --file deploy/vps/compose.yaml --env-file deploy/vps/.env config --services)"
          grep -qx api <<<"$services"
          grep -qx fx-refresh <<<"$services"
          grep -qx mcp-control <<<"$services"
          ! grep -qx caddy <<<"$services"
          ! grep -R -E '(^|[^0-9])(80:80|443:443)' deploy/vps/compose.yaml
          test ! -e deploy/vps/Caddyfile

  # Automatic production delivery of market-api-production (aiaiaiai-org/infra
  # docs/automatic-delivery.md, docs/market-postgres-production.md). Runs only
  # for a master push whose CI passed, and only once the owner set the
  # repository variable PRODUCTION_DELIVERY=enabled after filling the
  # production Environment. Infra verifies both attestations against this
  # workflow, branch and commit; this repository holds no infra credential.
  publish-production:
    needs: [unit, test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.PRODUCTION_DELIVERY == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/0xda-market/core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Seal the production credentials to the edge-prod-1 recipient
        env:
          MARKET_POSTGRES_PASSWORD: ${{ secrets.MARKET_POSTGRES_PASSWORD }}
          PUBLIC_API_TOKEN: ${{ secrets.PUBLIC_API_TOKEN }}
          MANUAL_PROVIDER_TOKEN: ${{ secrets.MANUAL_PROVIDER_TOKEN }}
          NILX_BROWSER_HANDOFF_TOKEN: ${{ secrets.NILX_BROWSER_HANDOFF_TOKEN }}
          TRADING_LAB_SERVICE_TOKEN: ${{ secrets.TRADING_LAB_SERVICE_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          for name in MARKET_POSTGRES_PASSWORD PUBLIC_API_TOKEN MANUAL_PROVIDER_TOKEN NILX_BROWSER_HANDOFF_TOKEN TRADING_LAB_SERVICE_TOKEN; do
            value="$(printenv "$name")"
            test -n "$value" || { echo "::error::Missing production secret $name." >&2; exit 1; }
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || { echo "::error::Invalid multiline value for $name." >&2; exit 1; }
          done
          (( ${#MARKET_POSTGRES_PASSWORD} >= 24 )) || { echo "::error::MARKET_POSTGRES_PASSWORD must be at least 24 characters." >&2; exit 1; }
          (( ${#NILX_BROWSER_HANDOFF_TOKEN} >= 32 )) || { echo "::error::NILX_BROWSER_HANDOFF_TOKEN must be at least 32 bytes." >&2; exit 1; }
          (( ${#TRADING_LAB_SERVICE_TOKEN} >= 32 )) || { echo "::error::TRADING_LAB_SERVICE_TOKEN must be at least 32 bytes." >&2; exit 1; }
          # Core's DatabaseTarget requires the password in the URL. Derive it from
          # the one password the database is created with, so they cannot drift.
          MARKET_DATABASE_URL="$(ruby -rerb -e 'print "postgres://market:#{ERB::Util.url_encode(ENV.fetch("MARKET_POSTGRES_PASSWORD"))}@market-postgres-production:1927/market"')"
          export MARKET_DATABASE_URL
          echo "::add-mask::$MARKET_DATABASE_URL"
          # Trading Lab is part of production Market: its workloads take the database URL and
          # their service token from this envelope (infra runtime.secretsFrom), so it holds
          # no production secret of its own.
          names=(MARKET_DATABASE_URL MARKET_POSTGRES_PASSWORD PUBLIC_API_TOKEN MANUAL_PROVIDER_TOKEN NILX_BROWSER_HANDOFF_TOKEN TRADING_LAB_SERVICE_TOKEN)
          # The envelope carries exactly the names market-api-production maps.
          contract="$(curl -fsSL https://raw.githubusercontent.com/aiaiaiai-org/infra/master/contracts/services/market-api-production.yaml)"
          mapped="$(sed -n 's/^      - [A-Z0-9_]*=\([A-Z0-9_]*\)$/\1/p' <<<"$(sed -n '/^    secrets:/,/^    [a-z]/p' <<<"$contract")" | sort)"
          test "$mapped" = "$(printf '%s\n' "${names[@]}" | sort)" || {
            echo "::error::market-api-production maps different secret names than this envelope carries." >&2
            exit 1
          }
          server="$(curl -fsSL https://raw.githubusercontent.com/aiaiaiai-org/infra/master/contracts/servers/edge-prod-1.yaml)"
          recipient="$(sed -n 's/^  encryptionRecipient: //p' <<<"$server")"
          [[ "$recipient" =~ ^ssh-ed25519\ [A-Za-z0-9+/]{68}$ ]] || {
            echo "::error::edge-prod-1 publishes no valid encryptionRecipient." >&2
            exit 1
          }
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          mkdir -p "$RUNNER_TEMP/envelope"
          for name in "${names[@]}"; do printf '%s=%s\n' "$name" "$(printenv "$name")"; done |
            age --recipient "$recipient" --output "$RUNNER_TEMP/envelope/secrets.age"
          test -s "$RUNNER_TEMP/envelope/secrets.age"
          printf 'FROM scratch\nCOPY secrets.age /secrets.age\n' > "$RUNNER_TEMP/envelope/Dockerfile"
          echo "ENVELOPE_CONTEXT=$RUNNER_TEMP/envelope" >> "$GITHUB_ENV"

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the commit image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Attest the commit image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Publish the secret envelope
        id: envelope
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ENVELOPE_CONTEXT }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}.secrets

      - name: Attest the secret envelope
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.envelope.outputs.digest }}
          push-to-registry: true
