name: Deploy Market PostgreSQL

on:
  workflow_dispatch:
    inputs:
      recovery_ready:
        description: Type RECOVERY_READY after verifying isolated restore and off-host backup procedure
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: market-production-postgres
  cancel-in-progress: false

jobs:
  request:
    name: Request production DB activation through infra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      # TEST deploys from master; RELEASE (production) only from release branches.
      - name: Require a release branch
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -Eeuo pipefail
          [[ "$WORKFLOW_REF" =~ ^refs/heads/release(-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))?$ ]] || {
            echo "::error::Run production activation from a release branch (release or release-X.Y), not $WORKFLOW_REF."
            exit 1
          }

      - name: Enforce manual recovery gate
        env:
          RECOVERY_READY: ${{ inputs.recovery_ready }}
        run: |
          set -Eeuo pipefail
          test "$RECOVERY_READY" = RECOVERY_READY || {
            echo "::error::Recovery procedure and off-host backup must be verified before activation."
            exit 1
          }

      - name: Obtain short-lived public recipient from infra
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          INFRA_REPOSITORY: aiaiaiai-org/infra
          WORKLOAD: market-postgres-production
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN" || { echo "::error::Missing INFRA_DEPLOY_TOKEN in production."; exit 1; }

          # No stored recipient variable: derive the PUBLIC key from the SSH
          # identity of the workload's server-owned GitHub Environment.
          # This request contains no market credentials.
          workflow="issue-workload-recipient.yml"
          runs_endpoint="repos/$INFRA_REPOSITORY/actions/workflows/$workflow/runs"
          baseline="$(gh api --method GET "$runs_endpoint?event=repository_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')"
          [[ "$baseline" =~ ^[0-9]+$ ]]

          jq -n --arg workload "$WORKLOAD" --arg request_id "$GITHUB_RUN_ID"             '{event_type: "issue-workload-recipient", client_payload: {workload: $workload, request_id: $request_id}}' |
            gh api --method POST "repos/$INFRA_REPOSITORY/dispatches" --input -

          title="Recipient $WORKLOAD / $GITHUB_RUN_ID"
          recipient_run=""
          for attempt in $(seq 1 36); do
            # Match the exact run-title and only runs created after our dispatch
            # baseline. Failed recipient requests fail closed; never use stale keys.
            response="$(gh api --method GET "$runs_endpoint?event=repository_dispatch&per_page=100")"
            matched="$(jq -c --arg title "$title" --argjson baseline "$baseline" '
              [.workflow_runs[] | select(.id > $baseline and .display_title == $title
                and .head_branch == "master")] | sort_by(.id) | last // empty
            ' <<<"$response")"
            if [[ -n "$matched" ]]; then
              recipient_run="$(jq -r '.id' <<<"$matched")"
              status="$(jq -r '.status' <<<"$matched")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$matched")"
              if [[ "$status" == completed ]]; then
                if [[ "$conclusion" != success ]]; then
                  echo "::error::Infra public-recipient request did not succeed." >&2
                  exit 1
                fi
                break
              fi
            fi
            sleep 10
          done

          test -n "$recipient_run" && [[ "$status" == completed && "$conclusion" == success ]] || {
            echo "::error::Timed out obtaining infra public recipient." >&2
            exit 1
          }

          recipient_dir="$RUNNER_TEMP/market-recipient"
          mkdir -m 0700 "$recipient_dir"
          gh run download "$recipient_run" --repo "$INFRA_REPOSITORY"             --name "recipient-$WORKLOAD-$GITHUB_RUN_ID" --dir "$recipient_dir"
          recipient_file="$recipient_dir/recipient.pub"
          test -s "$recipient_file"
          [[ "$(wc -l < "$recipient_file")" -eq 1 ]]
          grep -Eq '^ssh-(ed25519|rsa) [A-Za-z0-9+/=]+( .*)?$' "$recipient_file"
          ssh-keygen -lf "$recipient_file" >/dev/null
          echo "INFRA_RECIPIENT_PATH=$recipient_file" >>"$GITHUB_ENV"
          echo "Verified public recipient from infra workflow run $recipient_run."

      - name: Encrypt scoped DB secret and request infra deployment
        env:
          INFRA_RECIPIENT_PATH: ${{ env.INFRA_RECIPIENT_PATH }}
          MARKET_POSTGRES_PASSWORD: ${{ secrets.MARKET_POSTGRES_PASSWORD }}
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$GH_TOKEN" || { echo "::error::Missing INFRA_DEPLOY_TOKEN in production."; exit 1; }
          test -s "$INFRA_RECIPIENT_PATH" || { echo "::error::Missing verified infra public recipient."; exit 1; }
          test -n "$MARKET_POSTGRES_PASSWORD" || { echo "::error::Missing MARKET_POSTGRES_PASSWORD in production."; exit 1; }
          [[ "$MARKET_POSTGRES_PASSWORD" != *$'\n'* && "$MARKET_POSTGRES_PASSWORD" != *$'\r'* ]] || {
            echo "::error::Database secret may not contain newlines."
            exit 1
          }
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

          source_file="$RUNNER_TEMP/market-postgres-source.env"
          encrypted_file="$RUNNER_TEMP/market-postgres-secrets.age"
          trap 'rm -f "$source_file" "$encrypted_file"; rm -rf "$RUNNER_TEMP/market-recipient"' EXIT

          printf 'MARKET_POSTGRES_PASSWORD=%s\n' "$MARKET_POSTGRES_PASSWORD" > "$source_file"
          age --armor --recipient "$(cat "$INFRA_RECIPIENT_PATH")" --output "$encrypted_file" "$source_file"
          rm -f "$source_file"

          jq -n --arg workload "market-postgres-production"             --rawfile secrets_age "$encrypted_file"             '{event_type: "deploy-workload", client_payload: {workload: $workload, secrets_age: $secrets_age}}' |
            gh api --method POST repos/aiaiaiai-org/infra/dispatches --input -

          {
            echo "### Market production PostgreSQL"
            echo
            echo "Encrypted, scoped deployment request submitted to aiaiaiai-org/infra."
            echo "The public recipient was derived from the target Environment for this run."
            echo "Check the resulting Deploy workload run for target edge-prod-1 and activation status."
            echo "This step does not confirm database health, backups, or application readiness."
          } >> "$GITHUB_STEP_SUMMARY"
