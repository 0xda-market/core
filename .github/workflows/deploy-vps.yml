name: Deploy

on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to deploy
        required: true
        default: master
        type: string
      environment:
        description: GitHub and VPS environment
        required: true
        default: development
        type: choice
        options:
          - development
          - production

permissions:
  contents: read
  statuses: write

concurrency:
  group: vps-api-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'development' }}
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.event.pull_request.merge_commit_sha }}
      FORCE_ACTIVATE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_DEPLOYMENT_PATH: ${{ vars.SSH_DEPLOYMENT_PATH }}
      VPS_RUNTIME_PATH: /opt/0xda-market-runtime
      MCP_CONTROL_REF: 2f9766ea6993716d2d79ad91a4ce40f18baa44ef

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Resolve immutable release
        run: echo "RELEASE_SHA=$(git rev-parse HEAD)" >>"$GITHUB_ENV"

      - name: Validate deployment configuration
        run: |
          set -Eeuo pipefail
          case "$DEPLOY_ENV" in development|production) ;; *) exit 1 ;; esac
          case "$FORCE_ACTIVATE" in 0|1) ;; *) exit 1 ;; esac
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            test "$DEPLOY_ENV" = development
            test "$FORCE_ACTIVATE" = 0
          fi
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_DEPLOYMENT_PATH SSH_PORT; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is not configured for the ${DEPLOY_ENV} environment"
              missing=1
            fi
          done
          test "$missing" -eq 0
          test -n "$RELEASE_REF"
          test -n "$RELEASE_SHA"
          test -n "$MCP_CONTROL_REF"

      - name: Check out pinned mcp-control
        uses: actions/checkout@v4
        with:
          repository: 0x0sky/mcp-control
          ref: ${{ env.MCP_CONTROL_REF }}
          path: .deps/mcp-control
          persist-credentials: false

      - name: Set up Go for mcp-control
        uses: actions/setup-go@v5
        with:
          go-version-file: .deps/mcp-control/go.mod
          cache: false

      - name: Build pinned mcp-control
        run: |
          set -Eeuo pipefail
          install -d -m 0755 deploy/vps/mcp-control/bin
          (
            cd .deps/mcp-control
            go test ./...
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
                go build \
                  -trimpath \
                  -ldflags="-s -w -X github.com/0x0sky/mcp-control/internal/cli.Version=$MCP_CONTROL_REF" \
                  -o "$GITHUB_WORKSPACE/deploy/vps/mcp-control/bin/mcp-control-$arch" \
                  ./cmd/mcp-control
            done
          )
          chmod 0755 deploy/vps/mcp-control/bin/mcp-control-*

      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          install -m 0700 -d "$HOME/.ssh"

          key_path="$HOME/.ssh/id_ed25519"
          known_hosts_path="$HOME/.ssh/known_hosts"
          keyscan_output="$HOME/.ssh/known_hosts.pending"
          keyscan_error="$HOME/.ssh/ssh-keyscan.error"

          printf '%s\n' "$SSH_PRIVATE_KEY" >"$key_path"
          chmod 0600 "$key_path"

          if ! ssh-keygen -y -f "$key_path" >/dev/null; then
            echo "::error::SSH_PRIVATE_KEY is not a valid OpenSSH private key"
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 5 -p "$SSH_PORT" -H "$SSH_HOST" \
              >"$keyscan_output" 2>"$keyscan_error" && [[ -s "$keyscan_output" ]]; then
              sort -u "$keyscan_output" >"$known_hosts_path"
              chmod 0600 "$known_hosts_path"
              break
            fi

            if [[ "$attempt" -eq 5 ]]; then
              cat "$keyscan_error" >&2 || true
              echo "::error::Cannot reach the configured VPS SSH endpoint on TCP ${SSH_PORT}. Ensure sshd is listening and every provider/UFW firewall allows the port."
              exit 1
            fi

            sleep $((attempt * 2))
          done

      - name: Upload release
        run: |
          set -Eeuo pipefail
          archive="/tmp/0xda-market-${DEPLOY_ENV}-${RELEASE_SHA}.tar.gz"
          tar --exclude=.git --exclude='.deps' --exclude='deploy/vps/.env' -czf "$archive" .
          scp -P "$SSH_PORT" "$archive" "$SSH_USER@$SSH_HOST:/tmp/"

      - name: Stage or activate environment
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$SSH_DEPLOYMENT_PATH' RUNTIME_PATH='$VPS_RUNTIME_PATH' DEPLOY_ENV='$DEPLOY_ENV' FORCE_ACTIVATE='$FORCE_ACTIVATE' RELEASE_SHA='$RELEASE_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          environment_root="$DEPLOY_PATH/environments/$DEPLOY_ENV"
          archive="/tmp/0xda-market-${DEPLOY_ENV}-${RELEASE_SHA}.tar.gz"
          release_dir="$environment_root/releases/$RELEASE_SHA"
          shared_env="$environment_root/shared/.env"
          current_link="$environment_root/current"
          active_environment=""
          previous_release="$(readlink -f "$current_link" 2>/dev/null || true)"

          test -f "$shared_env"
          grep -qx "DEPLOY_ENV=$DEPLOY_ENV" "$shared_env"
          case "$FORCE_ACTIVATE" in 0|1) ;; *) exit 1 ;; esac

          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          rm -f "$archive"
          ln -sfn "$shared_env" "$release_dir/deploy/vps/.env"

          if [[ -f "$RUNTIME_PATH/active-environment" ]]; then
            active_environment="$(<"$RUNTIME_PATH/active-environment")"
          fi

          if [[ "$FORCE_ACTIVATE" == "1" || "$active_environment" == "$DEPLOY_ENV" ]]; then
            if ! DEPLOY_MODE=activate bash "$release_dir/deploy/vps/deploy.sh"; then
              if [[ -n "$previous_release" && -d "$previous_release/deploy/vps" ]]; then
                DEPLOY_MODE=activate bash "$previous_release/deploy/vps/deploy.sh" || true
              fi
              exit 1
            fi
          else
            DEPLOY_MODE=stage bash "$release_dir/deploy/vps/deploy.sh"
          fi

          ln -sfn "$release_dir" "$current_link"

          find "$environment_root/releases" \
            -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr | tail -n +4 | cut -d' ' -f2- | xargs -r rm -rf
          REMOTE

      - name: Publish VPS deployment status
        if: always() && env.RELEASE_SHA != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          set -Eeuo pipefail
          description="core ${DEPLOY_ENV} VPS deployment failed"
          if [[ "$DEPLOY_STATE" == "success" ]]; then
            description="core ${DEPLOY_ENV} VPS deployment is healthy"
          fi
          payload="$(jq -nc \
            --arg state "$DEPLOY_STATE" \
            --arg context "deploy/vps-core-${DEPLOY_ENV}" \
            --arg description "$description" \
            --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${RELEASE_SHA}" \
            --data "$payload"
