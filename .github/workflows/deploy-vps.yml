name: Deploy development via infra
run-name: Deploy Market Core ${{ inputs.request_id || github.sha }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional stack deployment correlation ID
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: market-core-development-deploy
  cancel-in-progress: false

jobs:
  package:
    name: Require master Full CI and publish immutable Core image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Gate on successful exact-head master push CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/master || {
            echo "::error::Development deployment only accepts master." >&2
            exit 1
          }
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=30")"
          jq -e --arg sha "$GITHUB_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha
              and .head_branch == "master"
              and .status == "completed"
              and .conclusion == "success")] | length > 0
          ' <<<"$runs" >/dev/null || {
            echo "::error::Exact master SHA must pass push Full CI." >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to producer GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/0xda-market/core:development-${{ github.sha }}

      - name: Pin image by digest
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ref=ghcr.io/0xda-market/core@$DIGEST" >> "$GITHUB_OUTPUT"

  activate_api:
    name: Activate Core API and migrations
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: development
    env:
      WORKLOAD: market-api-development
      IMAGE_REF: ${{ needs.package.outputs.image }}
      GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PUBLIC_API_TOKEN: ${{ secrets.PUBLIC_API_TOKEN }}
      MANUAL_PROVIDER_TOKEN: ${{ secrets.MANUAL_PROVIDER_TOKEN }}
      NILX_BROWSER_HANDOFF_TOKEN: ${{ secrets.NILX_BROWSER_HANDOFF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Request and verify activation
        run: bash scripts/dispatch-development-workload.sh

  activate_workers:
    name: Activate development ${{ matrix.workload }}
    needs: [package, activate_api]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: development
    strategy:
      fail-fast: false
      matrix:
        workload:
          - market-fx-development
          - market-prices-development
    env:
      WORKLOAD: ${{ matrix.workload }}
      IMAGE_REF: ${{ needs.package.outputs.image }}
      GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Request and verify worker activation
        run: bash scripts/dispatch-development-workload.sh
