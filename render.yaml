# Manual-only TEST Market API. No production URLs, credentials, catalog activation
# or Identity wallet in this service. Deployment guide is in PR #144.
services:
  - type: web
    name: 0xda-market-test-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: DEPLOY_ENV
        value: development
      - key: PORT
        value: "10000"
      - key: ENABLE_MOCK_PAYMENT_PROVIDER
        value: "0"
      # Both gates must be enabled manually only after the test Identity,
      # TEST bot, issuer routes, catalog and end-to-end smoke are verified.
      - key: ENABLE_NILX_SEEDS_CHECKOUT
        sync: false
      - key: ENABLE_ISSUER_ORDER_ROUTES
        sync: false
      # Configure the existing 0xda-market-test Supabase *session pooler* URL
      # in the Render Dashboard. Never put a database password in Git.
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_API_TOKEN
        sync: false
      - key: MANUAL_PROVIDER_TOKEN
        sync: false
      # Matches only the development 0x1 Identity and test bot authority.
      - key: NILX_BROWSER_HANDOFF_TOKEN
        sync: false
      - key: ISSUER_DIRECTORY_URL
        sync: false
      - key: ISSUER_DIRECTORY_TOKEN
        sync: false
      - key: ISSUER_DIRECTORY_PROVIDERS
        value: telegram
      - key: CHANNEL_ASSERTION_SECRET
        sync: false
      - key: CHANNEL_ASSERTION_PROVIDERS
        value: telegram
