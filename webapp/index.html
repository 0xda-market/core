<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>0xda-market</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div>
          <p class="eyebrow">0xda-market</p>
          <h1>Catalog</h1>
        </div>
        <output id="snapshot" class="snapshot" aria-live="polite">loading</output>
      </header>

      <section class="controls" aria-label="Catalog controls">
        <input id="search" type="search" placeholder="Search products" autocomplete="off">
        <select id="category" aria-label="Category">
          <option value="">All categories</option>
        </select>
      </section>

      <section id="status" class="status" aria-live="polite">Loading complete catalog…</section>
      <section id="products" class="products" aria-label="Products"></section>

      <nav class="navigation" aria-label="Catalog pages">
        <button id="previous" type="button" aria-label="Previous page">←</button>
        <button id="home" type="button">Categories</button>
        <button id="next" type="button" aria-label="Next page">→</button>
      </nav>
    </main>

    <dialog id="product-dialog">
      <form method="dialog" class="dialog-card">
        <button class="dialog-close" value="cancel" aria-label="Close">×</button>
        <p id="dialog-category" class="eyebrow"></p>
        <h2 id="dialog-name"></h2>
        <p id="dialog-price" class="dialog-price"></p>
        <p class="dialog-note">Checkout requires an authenticated channel session.</p>
      </form>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
